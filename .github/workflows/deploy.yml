name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 關鍵設定：GitHub Actions 必須要有寫入 id-token 的權限才能向 GCP 換取憑證
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 🌟 WIF 驗證步驟（取代原本的 JSON 金鑰）
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/1086618854672/locations/global/workloadIdentityPools/github-pool/providers/github-provider-v2'
        service_account: 'github-deployer@project-eb2c4474-5ec9-4b7f-be8.iam.gserviceaccount.com'

    # 後續你可以直接呼叫 gcloud 命令或部署 Cloud Run，皆已自動授權
    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: 'pet-plan'
        region: 'europe-west1'
        source: '.' 
        flags: '--artifact-registry=projects/project-eb2c4474-5ec9-4b7f-be8/locations/europe-west1/repositories/cloud-run-source-deploy'
